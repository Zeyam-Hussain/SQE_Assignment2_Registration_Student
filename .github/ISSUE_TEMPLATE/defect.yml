name: Defect report
description: Report a behavior that conflicts with a functional requirement.
title: "[Defect]: "
labels:
  - bug
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement ID
      description: Which FR requirement does the behavior violate?
      placeholder: FR-01
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the exact input values and command or test to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: State the result required by REQUIREMENTS.md.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Paste the observed result or relevant pytest failure.
    validations:
      required: true
  - type: input
    id: failed-test
    attributes:
      label: Failed test ID
      placeholder: A2-TID-8
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Issue status
      options:
        - Open / triage needed
        - In progress
        - Fixed / ready to close
    validations:
      required: true
