name: pytest and coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run initial black-box coverage
        shell: bash
        run: |
          mkdir -p docs
          set +e
          python -m pytest tests/test_blackbox.py --cov=registration --cov-branch --cov-report=term-missing > docs/coverage_initial.txt 2>&1
          result=$?
          cat docs/coverage_initial.txt
          printf '%s\n' "$result" > docs/coverage_initial_exit_code.txt
          exit 0

      - name: Run complete test and coverage suite
        shell: bash
        run: |
          set +e
          python -m pytest tests/ --cov=registration --cov-branch --cov-report=term-missing > docs/coverage_final.txt 2>&1
          result=$?
          cat docs/coverage_final.txt
          printf '%s\n' "$result" > docs/coverage_final_exit_code.txt
          exit 0

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-evidence
          path: |
            docs/coverage_initial.txt
            docs/coverage_final.txt
            docs/coverage_initial_exit_code.txt
            docs/coverage_final_exit_code.txt
          if-no-files-found: error

      - name: Fail check when tests fail
        if: always()
        shell: bash
        run: |
          if [[ "$(cat docs/coverage_initial_exit_code.txt)" != "0" || "$(cat docs/coverage_final_exit_code.txt)" != "0" ]]; then
            echo "One or more pytest runs failed. See the uploaded evidence artifact."
            exit 1
          fi
